<style>
/* The tools menu at the site root: CG Pro header, a card per published tool, the newsletter. Same dark field and tokens as the tools. */
:root {
  color-scheme: dark;
  --orange: #FF9900;
  --orange-40: rgba(255,153,0,.40);
  --grey-10: #E5E5E5;
  --grey-40: #999999;
  --ink: #212121;
  --line: rgba(229,229,229,.14);
  --font-display: "Bebas Neue", "Haettenschweiler", "Arial Narrow", sans-serif;
  --font-core: "Montserrat", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--ink); color: var(--grey-40); font: 300 15px/1.6 var(--font-core);
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 1160px; margin: 0 auto; display: grid; gap: 40px }
:focus-visible { outline: 1px solid var(--orange); outline-offset: 2px }

header.top { display: flex; align-items: center; gap: 16px }
header.top img { width: 52px; height: auto; flex: none; display: block }
.eyebrow { font: 600 12px/1.3 var(--font-core); letter-spacing: .14em; text-transform: uppercase; color: var(--orange); margin: 0 0 4px }
h1 { font: 400 clamp(40px, 6vw, 64px)/.92 var(--font-display); letter-spacing: .01em; color: var(--grey-10); margin: 0; text-transform: uppercase }
.sub { margin: 0; max-width: 54ch; font-size: 14px }

/* One card per tool; the whole card is the link. A .thumb image (a ~640px webp inlined as a data: URI, so the page needs no image file) bleeds to the card's top edge, cropped to a banner shape */
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; padding: 0; margin: 0; list-style: none }
.tool { display: grid; gap: 10px; align-content: start; height: 100%; padding: 22px 24px; border-radius: 18px; border: 1px solid var(--line);
  background: rgba(0,0,0,.45); color: inherit; text-decoration: none; transition: border-color 200ms, box-shadow 200ms }
.tool:hover { border-color: var(--orange-40); box-shadow: 0 12px 32px rgba(0,0,0,.5) }
.tool .thumb { display: block; width: calc(100% + 48px); max-width: none; height: auto; margin: -22px -24px 4px; aspect-ratio: 1.91 / 1;
  object-fit: cover; border-radius: 17px 17px 0 0; border-bottom: 1px solid var(--line) }
.tool h2 { font: 400 32px/1 var(--font-display); text-transform: uppercase; letter-spacing: .01em; color: var(--grey-10); margin: 0 }
.tool p { margin: 0; font-size: 14px }
.tool .go { font: 600 12px/1 var(--font-core); letter-spacing: .1em; text-transform: uppercase; color: var(--orange); margin-top: 6px }

/* Newsletter: heading beside a narrow card on desktop, above it on phones; the card is light so HubSpot's form styling reads */
.signup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 32px; align-items: center }
.signup:has(#hs-form:empty) { display: none }
.signup h2 { font: 400 clamp(40px, 5.5vw, 64px)/.95 var(--font-display); text-transform: uppercase; letter-spacing: .01em; color: var(--grey-10); margin: 0 }
.signup-card { padding: 20px 24px; border-radius: 18px; background: #f4f4f4; color: #111 }
@media (max-width: 720px) { .signup { grid-template-columns: minmax(0, 1fr); gap: 16px } }
</style>
